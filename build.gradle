plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation('com.google.inject.extensions:guice-testlib:5.1.0') {
        exclude group: 'com.google.inject', module: 'guice'
    }
    testImplementation(group: 'net.runelite', name: 'client', version: runeLiteVersion) {
        exclude group: 'com.google.inject', module: 'guice'
    }
    testImplementation 'com.google.inject:guice:5.1.0'
    testImplementation(group: 'net.runelite', name: 'jshell', version: runeLiteVersion) {
        exclude group: 'com.google.inject', module: 'guice'
    }
}

group = 'com.geel.hunterrumours'
version = '1.3.12'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


test {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

// Launch a RuneLite dev client with this plugin loaded: ./gradlew runClient
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs RuneLite with the Hunter Rumours plugin loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.geel.hunterrumours.HunterRumoursPluginTest'
    args = ['--developer-mode']
    jvmArgs = ['-ea']
}
